networks:
  frontend:
  backend:

volumes:
  pihole:
  portainer_data:

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    command: -H tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    volumes:
      - portainer_data:/data
    ports:
      - 9443:9443
      - 9000:9000
    networks:
      - frontend
      - backend

  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Keep the API on the backend network only; Portainer reaches it as
    # tcp://socket-proxy:2375. Do not publish 2375 to the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info
      - EVENTS=1
      - PING=1
      - VERSION=1
      - AUTH=0
      - SECRETS=1
      - POST=1
      - BUILD=1
      - COMMIT=1
      - CONFIGS=1
      - CONTAINERS=1
      - DISTRIBUTION=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=1
      - PLUGINS=1
      - SERVICES=1
      - SESSION=1
      - SWARM=1
      - SYSTEM=1
      - TASKS=1
      - VOLUMES=1

  ndi-discovery:
    container_name: ndi-discovery
    build:
      context: ./
      dockerfile: Dockerfile
    network_mode: host
    restart: always
    volumes:
      - ./ndi-discovery/ndi-config.v1.json:/root/.ndi/ndi-config.json
